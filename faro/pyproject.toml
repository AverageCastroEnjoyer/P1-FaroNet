[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faro"
version = "0.1.0"
description = "Software - enlace óptico FaroNet"
requires-python = ">=3.11"
dependencies = ["PyNaCl>=1.5,<2"]

[project.optional-dependencies]
rpi = ["gpiozero>=2.0,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
