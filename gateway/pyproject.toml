[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faronet-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyNaCl>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
